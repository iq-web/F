  <div id="root"></div>
  <noscript><p style="padding:48px 24px;text-align:center;font-size:16px;line-height:1.9">يحتاج الموقع إلى تفعيل JavaScript لعرض المنتجات. للطلب مباشرة تواصل معنا عبر واتساب.</p></noscript>
  <script src="./storage-config.js"></script>
  <script src="./app.js"></script>
  <script>
    (function(){
      function tag(){var m=document.querySelector("main");if(m&&!m.id){m.id="main-content";m.setAttribute("tabindex","-1")}return !!(m&&m.id)}
      if(!tag()){var o=new MutationObserver(function(){if(tag())o.disconnect()});o.observe(document.getElementById("root"),{childList:true,subtree:true})}
    })();
    /* mark the current page in the bottom dock (router does not set aria-current) */
    (function(){
      function cur(){var h=location.hash;return (h.indexOf('#/')===0?h.slice(1):location.pathname).split('?')[0]||'/'}
      function mark(){
        var p=cur();
        document.querySelectorAll('.mobile-bottom-bar a').forEach(function(a){
          var t=(a.getAttribute('href')||'').replace(/^#/,'').split('?')[0];
          var on=t&&t!=='/'&&(p===t||p.indexOf(t+'/')===0);
          if(on){a.setAttribute('aria-current','page')}else{a.removeAttribute('aria-current')}
        });
      }
      ['hashchange','popstate'].forEach(function(e){window.addEventListener(e,mark)});
      ['pushState','replaceState'].forEach(function(k){var f=history[k];history[k]=function(){var r=f.apply(this,arguments);setTimeout(mark,0);return r}});
      var root=document.getElementById('root');
      new MutationObserver(mark).observe(root,{childList:true,subtree:true});
      mark();
    })();
  </script>
